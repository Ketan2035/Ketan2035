      x="810"
      y="155"
      width="330"
      height="95"
      rx="18"
      fill="#161b22"
      stroke="#30363d"
      stroke-width="1"
    />

  </g>


  <!-- =====================================================
       CURRENT STREAK
  ====================================================== -->

  <text
    x="225"
