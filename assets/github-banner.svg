    text-anchor="middle"
    fill="#58a6ff"
    font-family="Arial"
    font-size="30"
    font-weight="700"
    filter="url(#blueGlow)"
  >
    6 days
  </text>


  <!-- =====================================================
       CONTRIBUTIONS
  ====================================================== -->

  <text
    x="975"
    y="190"
