<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="420"
  viewBox="0 0 1200 420"
>

  <defs>

    <!-- GitHub Dark Background -->
    <linearGradient
      id="background"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="100%"
    >
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <!-- GitHub Blue Accent -->
    <linearGradient
      id="accent"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="0%"
    >
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#2ea043"/>
      <stop offset="100%" stop-color="#39d353"/>
    </linearGradient>

    <!-- GitHub Green -->
    <linearGradient
      id="green"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="0%"
    >
      <stop offset="0%" stop-color="#0e4429"/>
      <stop offset="50%" stop-color="#26a641"/>
      <stop offset="100%" stop-color="#39d353"/>
    </linearGradient>

    <filter id="shadow">
      <feDropShadow
        dx="0"
        dy="6"
        stdDeviation="10"
        flood-color="#000000"
        flood-opacity="0.45"
      />
    </filter>

  </defs>


  <!-- ================= BACKGROUND ================= -->

  <rect
    width="1200"
    height="420"
    rx="28"
    fill="url(#background)"
  />


  <!-- GitHub-style subtle glow -->

  <circle
    cx="1080"
    cy="50"
    r="180"
    fill="#58a6ff"
    opacity="0.035"
  />

  <circle
    cx="80"
    cy="380"
    r="180"
    fill="#39d353"
    opacity="0.035"
  />


  <!-- ================= HEADER ================= -->

  <text
    x="600"
    y="70"
    text-anchor="middle"
    fill="#f0f6fc"
    font-family="Arial, Helvetica, sans-serif"
    font-size="42"
    font-weight="700"
  >
    Ketan Kumar
  </text>


  <text
    x="600"
    y="105"
    text-anchor="middle"
    fill="#8b949e"
    font-family="Arial, Helvetica, sans-serif"
    font-size="17"
